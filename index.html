<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#315dc5">
<title>ApuntaFácil</title>

<style>
:root {
  --blue: #315dc5;
  --navy: #203c7a;
  --pale: #edf3ff;
  --ink: #202a3b;
  --muted: #667085;
  --line: #dce4f2;
  --bg: #f5f7fc;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, sans-serif;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 13px;
  padding: 11px 14px;
  font-weight: 750;
}

.app {
  max-width: 900px;
  margin: auto;
  padding: 18px 14px 40px;
}

.top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.logo {
  width: 52px;
  height: 52px;
  border-radius: 17px;
  background: #dce8ff;
  display: grid;
  place-items: center;
  font-size: 28px;
}

.brand {
  font-size: 25px;
  font-weight: 900;
  color: var(--navy);
}

.tag, .small {
  color: var(--muted);
  font-size: 13px;
}

.hero {
  background: linear-gradient(135deg, #eaf1ff, #f8f0ff);
  border: 1px solid #dce5fa;
  border-radius: 23px;
  padding: 22px;
  margin-bottom: 15px;
}

.hero h1 {
  font-size: clamp(25px, 5vw, 35px);
  line-height: 1.15;
  margin: 0 0 10px;
}

.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  margin: 14px 0;
  box-shadow: 0 5px 20px #243b6408;
}

.card h2 {
  font-size: 20px;
  margin-top: 4px;
}

.primary {
  background: var(--blue);
  color: white;
  width: 100%;
}

.secondary {
  background: #edf2ff;
  color: var(--navy);
}

.outline {
  background: white;
  border: 1px solid var(--line);
  color: var(--navy);
}

label {
  display: block;
  font-weight: 700;
  margin: 12px 0 6px;
}

input[type="text"],
input[type="search"],
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #cfd8e8;
  border-radius: 12px;
  background: white;
  color: var(--ink);
}

textarea {
  min-height: 130px;
  resize: vertical;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.row > * {
  flex: 1;
}

.nav {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 16px 0;
}

.nav button {
  background: white;
  color: var(--navy);
  border: 1px solid var(--line);
}

.nav button.active {
  background: var(--blue);
  color: white;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.keyword {
  background: #fff0a6;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  font-weight: 800;
}

.item {
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 12px;
  margin: 9px 0;
}

.hidden {
  display: none !important;
}

.error {
  color: #b42318;
  font-size: 13px;
}

.notice {
  background: #fff4d7;
  border-radius: 12px;
  padding: 10px;
  font-size: 13px;
  margin-top: 10px;
}

.result {
  background: #f8faff;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 14px;
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 20px 0;
}

@media (min-width: 650px) {
  .nav {
    grid-template-columns: repeat(6, 1fr);
  }

  .app {
    padding: 25px 20px 45px;
  }
}
</style>
</head>

<body>
<main class="app">

<header class="top">
  <div class="logo">🧠</div>
  <div>
    <div class="brand">ApuntaFácil</div>
    <div class="tag">Aprende a tu manera · Gratis</div>
  </div>
</header>

<section class="hero">
  <h1>De tus apuntes a aprender de verdad.</h1>
  <p>Organiza tus apuntes, prepara exámenes y aprende jugando.</p>
</section>

<nav class="nav">
  <button class="active" data-page="home">🏠 Inicio</button>
  <button data-page="notes">📝 Apuntes</button>
  <button data-page="exam">✅ Tests</button>
  <button data-page="games">🎮 Juegos</button>
  <button data-page="videos">🎥 Vídeos</button>
  <button data-page="backup">💾 Datos</button>
</nav>

<script>
const $ = id => document.getElementById(id);

let notes = JSON.parse(localStorage.getItem("apuntaFacilNotes") || "[]");
let examQuestions = [];
let flashcards = [];
let currentCard = 0;

const tips = [
  "Divide el tema en pequeñas partes y descansa entre sesiones.",
  "Explica lo que has aprendido con tus propias palabras.",
  "Haz una pausa breve cuando notes que te cuesta concentrarte.",
  "Repasa tus apuntes e intenta recordar las ideas principales.",
  "Estudiar un poco cada día puede ayudarte a organizarte."
];

function saveData() {
  localStorage.setItem("apuntaFacilNotes", JSON.stringify(notes));
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

/* NAVEGACIÓN */
function showPage(pageId) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.toggle("active", page.id === pageId);
  });

  document.querySelectorAll("[data-page]").forEach(button => {
    button.classList.toggle("active", button.dataset.page === pageId);
  });

  if (pageId === "notes") renderNotes();
  if (pageId === "exam" || pageId === "games") updateNoteSelectors();
}

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

document.querySelectorAll("[data-go]").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.go));
});

/* CONSEJOS */
if ($("newTip")) {
  $("newTip").addEventListener("click", () => {
    $("studyTip").textContent =
      tips[Math.floor(Math.random() * tips.length)];
  });
}

/* FORMATO DE TEXTO */
if ($("boldBtn")) {
  $("boldBtn").addEventListener("click", () => {
    wrapSelection("**");
  });
}

if ($("highlightBtn")) {
  $("highlightBtn").addEventListener("click", () => {
    const area = $("noteText");
    const start = area.selectionStart;
    const end = area.selectionEnd;

    if (start === end) {
      alert("Selecciona primero el texto que quieres resaltar.");
      return;
    }

    const selected = area.value.slice(start, end);
    area.setRangeText("🟨 " + selected + " 🟨", start, end, "select");
    area.focus();
  });
}

function wrapSelection(marker) {
  const area = $("noteText");
  const start = area.selectionStart;
  const end = area.selectionEnd;

  if (start === end) {
    alert("Selecciona primero el texto.");
    return;
  }

  const selected = area.value.slice(start, end);
  area.setRangeText(marker + selected + marker, start, end, "select");
  area.focus();
}

/* DESTACAR PALABRAS CLAVE */
if ($("organizeBtn")) {
  $("organizeBtn").addEventListener("click", () => {
    const text = $("noteText").value.trim();

    if (!text) {
      alert("Escribe o importa primero tus apuntes.");
      return;
    }

    const words = text
      .toLowerCase()
      .match(/\b[\p{L}]{5,}\b/gu) || [];

    const stopWords = new Set([
      "porque", "cuando", "donde", "desde", "hasta",
      "entre", "sobre", "también", "pueden", "puede",
      "estos", "estas", "ellos", "ellas", "sería",
      "tiene", "tienen", "hacer", "muchos", "muchas"
    ]);

    const counts = {};

    words.forEach(word => {
      if (!stopWords.has(word)) {
        counts[word] = (counts[word] || 0) + 1;
      }
    });

    const keywords = Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(item => item[0]);

    if (!keywords.length) {
      alert("No he encontrado palabras clave suficientes.");
      return;
    }

    alert("Palabras clave detectadas:\n\n" + keywords.join(", "));
  });
}

/* GUARDAR APUNTES */
if ($("saveNote")) {
  $("saveNote").addEventListener("click", () => {
    const title = $("noteTitle").value.trim();
    const text = $("noteText").value.trim();

    if (!title || !text) {
      alert("Añade un título y escribe el contenido del apunte.");
      return;
    }

    notes.push({
      id: Date.now().toString(),
      title,
      subject: $("noteSubject").value.trim(),
      text,
      level: $("level") ? $("level").value : "",
      date: new Date().toISOString()
    });

    saveData();
    renderNotes();
    updateNoteSelectors();

    $("noteTitle").value = "";
    $("noteSubject").value = "";
    $("noteText").value = "";

    alert("¡Apunte guardado! 💾");
  });
}

function renderNotes() {
  const list = $("notesList");
  if (!list) return;

  const search = ($("searchNotes")?.value || "").toLowerCase();

  const filtered = notes.filter(note =>
    (note.title + " " + note.subject + " " + note.text)
      .toLowerCase().includes(search)
  );

  if (!filtered.length) {
    list.innerHTML = "<p>Aún no hay apuntes guardados.</p>";
    return;
  }

  list.innerHTML = filtered.map(note => `
    <article class="panel">
      <h3>${escapeHTML(note.title)}</h3>
      <p>${escapeHTML(note.subject || "Sin asignatura")}</p>
      <p>${escapeHTML(note.text.slice(0, 180))}${note.text.length > 180 ? "…" : ""}</p>
      <button data-open-note="${escapeHTML(note.id)}">Abrir</button>
      <button data-delete-note="${escapeHTML(note.id)}">Eliminar</button>
    </article>
  `).join("");

  list.querySelectorAll("[data-open-note]").forEach(button => {
    button.addEventListener("click", () => {
      const note = notes.find(n => n.id === button.dataset.openNote);
      if (!note) return;

      $("noteTitle").value = note.title;
      $("noteSubject").value = note.subject;
      $("noteText").value = note.text;
      showPage("notes");
    });
  });

  list.querySelectorAll("[data-delete-note]").forEach(button => {
    button.addEventListener("click", () => {
      if (!confirm("¿Quieres eliminar este apunte?")) return;

      notes = notes.filter(n => n.id !== button.dataset.deleteNote);
      saveData();
      renderNotes();
      updateNoteSelectors();
    });
  });
}

if ($("searchNotes")) {
  $("searchNotes").addEventListener("input", renderNotes);
}

/* LISTAS DE APUNTES PARA TESTS Y JUEGOS */
function updateNoteSelectors() {
  ["examNote", "gameNote"].forEach(id => {
    const select = $(id);
    if (!select) return;

    const previous = select.value;

    select.innerHTML = notes.length
      ? notes.map(note =>
          `<option value="${escapeHTML(note.id)}">${escapeHTML(note.title)}</option>`
        ).join("")
      : '<option value="">Guarda primero un apunte</option>';

    if (notes.some(note => note.id === previous)) {
      select.value = previous;
    }
  });
}

/* CREAR TEST */
if ($("startExam")) {
  $("startExam").addEventListener("click", () => {
    const note = notes.find(n => n.id === $("examNote").value);

    if (!note) {
      alert("Guarda un apunte antes de crear un test.");
      return;
    }

    const sentences = note.text
      .replace(/\n+/g, " ")
      .split(/[.!?]+/)
      .map(s => s.trim())
      .filter(s => s.split(/\s+/).length >= 5);

    if (sentences.length < 2) {
      alert("Necesitas al menos dos frases suficientemente largas.");
      return;
    }

    examQuestions = sentences
      .slice()
      .sort(() => Math.random() - 0.5)
      .slice(0, Number($("questionCount").value));

    renderExam();
  });
}

function renderExam() {
  const area = $("examArea");

  area.innerHTML = `
    <h3>Tu test</h3>
    <form id="examForm">
      ${examQuestions.map((sentence, index) => `
        <fieldset class="panel">
          <legend>Pregunta ${index + 1}</legend>
          <p>${escapeHTML(sentence)}</p>
          <label>
            <input type="radio" name="q${index}" value="yes" required>
            Lo entiendo y lo recuerdo
          </label>
          <label>
            <input type="radio" name="q${index}" value="no">
            Necesito repasarlo
          </label>
        </fieldset>
      `).join("")}
      <button type="submit">Corregir test</button>
    </form>
    <div id="examResult" aria-live="polite"></div>
  `;

  $("examForm").addEventListener("submit", event => {
    event.preventDefault();

    const form = new FormData(event.target);
    let correct = 0;

    examQuestions.forEach((_, index) => {
      if (form.get("q" + index) === "yes") correct++;
    });

    $("examResult").innerHTML = `
      <div class="panel">
        <h3>Resultado: ${correct} de ${examQuestions.length}</h3>
        <p>Estas preguntas son de autoevaluación, no de verdadero o falso.
        Repasa las frases que marcaste como pendientes.</p>
      </div>
    `;
  });
}

/* JUEGO DE TARJETAS */
if ($("startFlashcards")) {
  $("startFlashcards").addEventListener("click", () => {
    const note = notes.find(n => n.id === $("gameNote").value);

    if (!note) {
      alert("Guarda un apunte antes de jugar.");
      return;
    }

    flashcards = note.text
      .split(/[.!?\n]+/)
      .map(s => s.trim())
      .filter(s => s.length > 15);

    currentCard = 0;

    if (!flashcards.length) {
      alert("Este apunte no tiene suficiente texto para crear tarjetas.");
      return;
    }

    renderFlashcard();
  });
}

function renderFlashcard() {
  const area = $("gameArea");

  if (currentCard >= flashcards.length) {
    area.innerHTML = `
      <div class="panel">
        <h3>🎉 ¡Has terminado!</h3>
        <button id="restartCards">Jugar otra vez</button>
      </div>
    `;

    $("restartCards").addEventListener("click", () => {
      currentCard = 0;
      renderFlashcard();
    });
    return;
  }

  area.innerHTML = `
    <div class="panel">
      <p>Tarjeta ${currentCard + 1} de ${flashcards.length}</p>
      <h3>Lee y recuerda esta idea:</h3>
      <p>${escapeHTML(flashcards[currentCard])}</p>
      <button id="nextCard">Siguiente ➡️</button>
    </div>
  `;

  $("nextCard").addEventListener("click", () => {
    currentCard++;
    renderFlashcard();
  });
}

/* BUSCAR VÍDEOS */
if ($("searchVideos")) {
  $("searchVideos").addEventListener("click", () => {
    const subject = $("videoSubject").value.trim() ||
      ($("subject")?.value.trim() || "");

    if (!subject) {
      alert("Escribe una asignatura o tema.");
      return;
    }

    const level = $("level")?.value || "";
    const query = encodeURIComponent(
      subject + " explicación educativa " + level
    );

    $("videoResults").innerHTML = `
      <div class="panel">
        <p>Resultados para: ${escapeHTML(subject)} (${escapeHTML(level)})</p>
        <a href="https://www.youtube.com/results?search_query=${query}"
           target="_blank" rel="noopener noreferrer">
          ▶️ Ver vídeos educativos en YouTube
        </a>
      </div>
    `;
  });
}

/* EXPORTAR COPIA DE SEGURIDAD */
if ($("exportData")) {
  $("exportData").addEventListener("click", () => {
    const backup = {
      app: "ApuntaFácil",
      version: 1,
      exportedAt: new Date().toISOString(),
      notes
    };

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "apuntafacil-copia.json";
    link.click();

    URL.revokeObjectURL(url);

    $("backupStatus").textContent = "Copia de seguridad preparada.";
  });
}

/* IMPORTAR COPIA DE SEGURIDAD */
if ($("importData")) {
  $("importData").addEventListener("click", async () => {
    const file = $("importFile").files[0];

    if (!file) {
      alert("Selecciona primero un archivo JSON.");
      return;
    }

    try {
      const data = JSON.parse(await file.text());
      const importedNotes = Array.isArray(data) ? data : data.notes;

      if (!Array.isArray(importedNotes) ||
          !importedNotes.every(n =>
            n &&
            typeof n.title === "string" &&
            typeof n.text === "string"
          )) {
        throw new Error("Formato de copia no válido.");
      }

      if (!confirm("La importación sustituirá los apuntes actuales. ¿Continuar?")) {
        return;
      }

      notes = importedNotes.map(note => ({
        id: String(note.id || Date.now() + Math.random()),
        title: note.title,
        subject: String(note.subject || ""),
        text: note.text,
        level: String(note.level || ""),
        date: note.date || new Date().toISOString()
      }));

      saveData();
      renderNotes();
      updateNoteSelectors();

      $("backupStatus").textContent = "Copia importada correctamente.";
    } catch (error) {
      $("backupStatus").textContent =
        "No se pudo importar la copia. Comprueba que sea un JSON válido.";
    }
  });
}

/* BORRAR TODOS LOS APUNTES */
if ($("deleteAll")) {
  $("deleteAll").addEventListener("click", () => {
    if (!confirm("¿Seguro que quieres borrar todos los apuntes?")) return;

    notes = [];
    saveData();
    renderNotes();
    updateNoteSelectors();

    $("backupStatus").textContent = "Se han borrado los apuntes.";
  });
}

/* OCR: RECONOCIMIENTO DE TEXTO EN IMÁGENES */
if ($("ocrBtn")) {
  $("ocrBtn").addEventListener("click", async () => {
    const file = $("imageInput").files[0];

    if (!file) {
      alert("Selecciona una foto primero.");
      return;
    }

    if (!window.Tesseract) {
      $("ocrStatus").textContent =
        "No se ha cargado el OCR. Comprueba la conexión a internet y recarga la página.";
      return;
    }

    $("ocrBtn").disabled = true;
    $("ocrStatus").textContent = "Leyendo la foto... Puede tardar un poco.";

    try {
      const result = await Tesseract.recognize(file, "spa", {
        logger: message => {
          if (message.status === "recognizing text") {
            $("ocrStatus").textContent =
              "Reconociendo texto: " +
              Math.round((message.progress || 0) * 100) + "%";
          }
        }
      });

      const text = result.data.text.trim();

      if (!text) {
        $("ocrStatus").textContent =
          "No se ha encontrado texto legible en la imagen.";
      } else {
        $("noteText").value +=
          ($("noteText").value ? "\n\n" : "") + text;

        $("ocrStatus").textContent =
          "¡Texto reconocido! Revísalo por si hay errores.";
      }
    } catch (error) {
      $("ocrStatus").textContent =
        "No se ha podido leer la foto. Prueba con una imagen más nítida.";
    } finally {
      $("ocrBtn").disabled = false;
    }
  });
}

/* INICIO */
renderNotes();
updateNoteSelectors();
</script>

      "entre", "sobre", "también", "pueden", "puede",
      "estos", "estas", "ellos", "ellas", "sería",
      "tiene", "tienen", "hacer", "muchos", "muchas"
    ]);

    const counts = {};

    words.forEach(word => {
      if (!stopWords.has(word)) {
        counts[word] = (counts[word] || 0) + 1;
      }
    });

    const keywords = Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(item => item[0]);

    if (!keywords.length) {
      alert("No he encontrado palabras clave suficientes.");
      return;
    }

    alert("Palabras clave detectadas:\n\n" + keywords.join(", "));
  });
}

/* GUARDAR APUNTES */
if ($("saveNote")) {
  $("saveNote").addEventListener("click", () => {
    const title = $("noteTitle").value.trim();
    const text = $("noteText").value.trim();

    if (!title || !text) {
      alert("Añade un título y escribe el contenido del apunte.");
      return;
    }

    notes.push({
      id: Date.now().toString(),
      title,
      subject: $("noteSubject").value.trim(),
      text,
      level: $("level") ? $("level").value : "",
      date: new Date().toISOString()
    });

    saveData();
    renderNotes();
    updateNoteSelectors();

    $("noteTitle").value = "";
    $("noteSubject").value = "";
    $("noteText").value = "";

    alert("¡Apunte guardado! 💾");
  });
}

function renderNotes() {
  const list = $("notesList");
  if (!list) return;

  const search = ($("searchNotes")?.value || "").toLowerCase();

  const filtered = notes.filter(note =>
    (note.title + " " + note.subject + " " + note.text)
      .toLowerCase().includes(search)
  );

  if (!filtered.length) {
    list.innerHTML = "<p>Aún no hay apuntes guardados.</p>";
    return;
  }

  list.innerHTML = filtered.map(note => `
    <article class="panel">
      <h3>${escapeHTML(note.title)}</h3>
      <p>${escapeHTML(note.subject || "Sin asignatura")}</p>
      <p>${escapeHTML(note.text.slice(0, 180))}${note.text.length > 180 ? "…" : ""}</p>
      <button data-open-note="${escapeHTML(note.id)}">Abrir</button>
      <button data-delete-note="${escapeHTML(note.id)}">Eliminar</button>
    </article>
  `).join("");

  list.querySelectorAll("[data-open-note]").forEach(button => {
    button.addEventListener("click", () => {
      const note = notes.find(n => n.id === button.dataset.openNote);
      if (!note) return;

      $("noteTitle").value = note.title;
      $("noteSubject").value = note.subject;
      $("noteText").value = note.text;
      showPage("notes");
    });
  });

  list.querySelectorAll("[data-delete-note]").forEach(button => {
    button.addEventListener("click", () => {
      if (!confirm("¿Quieres eliminar este apunte?")) return;

      notes = notes.filter(n => n.id !== button.dataset.deleteNote);
      saveData();
      renderNotes();
      updateNoteSelectors();
    });
  });
}

if ($("searchNotes")) {
  $("searchNotes").addEventListener("input", renderNotes);
}

/* LISTAS DE APUNTES PARA TESTS Y JUEGOS */
function updateNoteSelectors() {
  ["examNote", "gameNote"].forEach(id => {
    const select = $(id);
    if (!select) return;

    const previous = select.value;

    select.innerHTML = notes.length
      ? notes.map(note =>
          `<option value="${escapeHTML(note.id)}">${escapeHTML(note.title)}</option>`
        ).join("")
      : '<option value="">Guarda primero un apunte</option>';

    if (notes.some(note => note.id === previous)) {
      select.value = previous;
    }
  });
}

/* CREAR TEST */
if ($("startExam")) {
  $("startExam").addEventListener("click", () => {
    const note = notes.find(n => n.id === $("examNote").value);

    if (!note) {
      alert("Guarda un apunte antes de crear un test.");
      return;
    }

    const sentences = note.text
      .replace(/\n+/g, " ")
      .split(/[.!?]+/)
      .map(s => s.trim())
      .filter(s => s.split(/\s+/).length >= 5);

    if (sentences.length < 2) {
      alert("Necesitas al menos dos frases suficientemente largas.");
      return;
    }

    examQuestions = sentences
      .slice()
      .sort(() => Math.random() - 0.5)
      .slice(0, Number($("questionCount").value));

    renderExam();
  });
}

function renderExam() {
  const area = $("examArea");

  area.innerHTML = `
    <h3>Tu test</h3>
    <form id="examForm">
      ${examQuestions.map((sentence, index) => `
        <fieldset class="panel">
          <legend>Pregunta ${index + 1}</legend>
          <p>${escapeHTML(sentence)}</p>
          <label>
            <input type="radio" name="q${index}" value="yes" required>
            Lo entiendo y lo recuerdo
          </label>
          <label>
            <input type="radio" name="q${index}" value="no">
            Necesito repasarlo
          </label>
        </fieldset>
      `).join("")}
      <button type="submit">Corregir test</button>
    </form>
    <div id="examResult" aria-live="polite"></div>
  `;

  $("examForm").addEventListener("submit", event => {
    event.preventDefault();

    const form = new FormData(event.target);
    let correct = 0;

    examQuestions.forEach((_, index) => {
      if (form.get("q" + index) === "yes") correct++;
    });

    $("examResult").innerHTML = `
      <div class="panel">
        <h3>Resultado: ${correct} de ${examQuestions.length}</h3>
        <p>Estas preguntas son de autoevaluación, no de verdadero o falso.
        Repasa las frases que marcaste como pendientes.</p>
      </div>
    `;
  });
}

/* JUEGO DE TARJETAS */
if ($("startFlashcards")) {
  $("startFlashcards").addEventListener("click", () => {
    const note = notes.find(n => n.id === $("gameNote").value);

    if (!note) {
      alert("Guarda un apunte antes de jugar.");
      return;
    }

    flashcards = note.text
      .split(/[.!?\n]+/)
      .map(s => s.trim())
      .filter(s => s.length > 15);

    currentCard = 0;

    if (!flashcards.length) {
      alert("Este apunte no tiene suficiente texto para crear tarjetas.");
      return;
    }

    renderFlashcard();
  });
}

function renderFlashcard() {
  const area = $("gameArea");

  if (currentCard >= flashcards.length) {
    area.innerHTML = `
      <div class="panel">
        <h3>🎉 ¡Has terminado!</h3>
        <button id="restartCards">Jugar otra vez</button>
      </div>
    `;

    $("restartCards").addEventListener("click", () => {
      currentCard = 0;
      renderFlashcard();
    });
    return;
  }

  area.innerHTML = `
    <div class="panel">
      <p>Tarjeta ${currentCard + 1} de ${flashcards.length}</p>
      <h3>Lee y recuerda esta idea:</h3>
      <p>${escapeHTML(flashcards[currentCard])}</p>
      <button id="nextCard">Siguiente ➡️</button>
    </div>
  `;

  $("nextCard").addEventListener("click", () => {
    currentCard++;
    renderFlashcard();
  });
}

/* BUSCAR VÍDEOS */
if ($("searchVideos")) {
  $("searchVideos").addEventListener("click", () => {
    const subject = $("videoSubject").value.trim() ||
      ($("subject")?.value.trim() || "");

    if (!subject) {
      alert("Escribe una asignatura o tema.");
      return;
    }

    const level = $("level")?.value || "";
    const query = encodeURIComponent(
      subject + " explicación educativa " + level
    );

    $("videoResults").innerHTML = `
      <div class="panel">
        <p>Resultados para: ${escapeHTML(subject)} (${escapeHTML(level)})</p>
        <a href="https://www.youtube.com/results?search_query=${query}"
           target="_blank" rel="noopener noreferrer">
          ▶️ Ver vídeos educativos en YouTube
        </a>
      </div>
    `;
  });
}

/* EXPORTAR COPIA DE SEGURIDAD */
if ($("exportData")) {
  $("exportData").addEventListener("click", () => {
    const backup = {
      app: "ApuntaFácil",
      version: 1,
      exportedAt: new Date().toISOString(),
      notes
    };

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "apuntafacil-copia.json";
    link.click();

    URL.revokeObjectURL(url);

    $("backupStatus").textContent = "Copia de seguridad preparada.";
  });
}

/* IMPORTAR COPIA DE SEGURIDAD */
if ($("importData")) {
  $("importData").addEventListener("click", async () => {
    const file = $("importFile").files[0];

    if (!file) {
      alert("Selecciona primero un archivo JSON.");
      return;
    }

    try {
      const data = JSON.parse(await file.text());
      const importedNotes = Array.isArray(data) ? data : data.notes;

      if (!Array.isArray(importedNotes) ||
          !importedNotes.every(n =>
            n &&
            typeof n.title === "string" &&
            typeof n.text === "string"
          )) {
        throw new Error("Formato de copia no válido.");
      }

      if (!confirm("La importación sustituirá los apuntes actuales. ¿Continuar?")) {
        return;
      }

      notes = importedNotes.map(note => ({
        id: String(note.id || Date.now() + Math.random()),
        title: note.title,
        subject: String(note.subject || ""),
        text: note.text,
        level: String(note.level || ""),
        date: note.date || new Date().toISOString()
      }));

      saveData();
      renderNotes();
      updateNoteSelectors();

      $("backupStatus").textContent = "Copia importada correctamente.";
    } catch (error) {
      $("backupStatus").textContent =
        "No se pudo importar la copia. Comprueba que sea un JSON válido.";
    }
  });
}

/* BORRAR TODOS LOS APUNTES */
if ($("deleteAll")) {
  $("deleteAll").addEventListener("click", () => {
    if (!confirm("¿Seguro que quieres borrar todos los apuntes?")) return;

    notes = [];
    saveData();
    renderNotes();
    updateNoteSelectors();

    $("backupStatus").textContent = "Se han borrado los apuntes.";
  });
}

/* OCR: RECONOCIMIENTO DE TEXTO EN IMÁGENES */
if ($("ocrBtn")) {
  $("ocrBtn").addEventListener("click", async () => {
    const file = $("imageInput").files[0];

    if (!file) {
      alert("Selecciona una foto primero.");
      return;
    }

    if (!window.Tesseract) {
      $("ocrStatus").textContent =
        "No se ha cargado el OCR. Comprueba la conexión a internet y recarga la página.";
      return;
    }

    $("ocrBtn").disabled = true;
    $("ocrStatus").textContent = "Leyendo la foto... Puede tardar un poco.";

    try {
      const result = await Tesseract.recognize(file, "spa", {
        logger: message => {
          if (message.status === "recognizing text") {
            $("ocrStatus").textContent =
              "Reconociendo texto: " +
              Math.round((message.progress || 0) * 100) + "%";
          }
        }
      });

      const text = result.data.text.trim();

      if (!text) {
        $("ocrStatus").textContent =
          "No se ha encontrado texto legible en la imagen.";
      } else {
        $("noteText").value +=
          ($("noteText").value ? "\n\n" : "") + text;

        $("ocrStatus").textContent =
          "¡Texto reconocido! Revísalo por si hay errores.";
      }
    } catch (error) {
      $("ocrStatus").textContent =
        "No se ha podido leer la foto. Prueba con una imagen más nítida.";
    } finally {
      $("ocrBtn").disabled = false;
    }
  });
}

/* INICIO */
renderNotes();
updateNoteSelectors();
</script>
