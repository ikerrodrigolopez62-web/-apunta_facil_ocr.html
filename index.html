<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApuntaFácil</title>
  <style>
    :root {
      --primary: #6558d3;
      --primary-dark: #5043bd;
      --background: #f5f6fc;
      --card: #ffffff;
      --text: #25243a;
      --muted: #73738a;
      --border: #e6e6f0;
      --success: #16845b;
      --danger: #c83d52;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: var(--primary);
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    nav {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      max-width: 1000px;
      margin: 15px auto 0;
    }

    button,
    .button {
      font-family: inherit;
      border: none;
      border-radius: 10px;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }

    button:active {
      transform: scale(.98);
    }

    .nav-button {
      background: #f0effb;
      color: var(--primary);
    }

    .nav-button.active,
    .primary {
      background: var(--primary);
      color: white;
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #efedf9;
      color: var(--primary);
    }

    .danger {
      background: #fff0f2;
      color: var(--danger);
    }

    main {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 18px 40px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .page-title {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .page-description {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.5;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(35, 30, 80, .035);
    }

    .card h2,
    .card h3 {
      margin-top: 0;
    }

    .drop-zone {
      border: 2px dashed #c8c4ee;
      border-radius: 14px;
      padding: 30px 18px;
      text-align: center;
      background: #faf9ff;
    }

    .drop-zone .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    input[type="file"] {
      max-width: 100%;
      margin: 12px 0;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      background: white;
      color: var(--text);
      outline: none;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 13px 0 7px;
    }

    .button-row {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .status.error {
      color: var(--danger);
    }
